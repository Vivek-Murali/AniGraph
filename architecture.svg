<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">AniGraph: proposed Python and Rust architecture</title>
<desc id="desc">Permitted sources enter Rust validation and a committed canonical snapshot. Neo4j stores graph facts and Python-prepared text vectors. A constrained Python planner retrieves both for grounded generation with citations or abstention. Evaluation and a later image extension are explicit stages.</desc>
